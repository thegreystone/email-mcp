name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Check and test Codex launcher
        run: |
          node --check plugin-codex/scripts/email-mcp.mjs
          node --test plugin-codex/tests/launcher.test.mjs

      - name: Upload uber-jar
        uses: actions/upload-artifact@v5
        with:
          name: email-mcp-server
          path: target/email-mcp-server-*-runner.jar
          retention-days: 14
