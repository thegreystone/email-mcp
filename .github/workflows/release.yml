name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Uber-jar (platform-independent) ──────────────────────────────────
  uber-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build uber-jar
        run: mvn -B package

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: uber-jar
          path: target/email-mcp-server-*-runner.jar

  # ── Native images ────────────────────────────────────────────────────
  native:
    strategy:
      # One platform failing should not cancel the others: their binaries are still useful, and a re-run
      # of the failed job alone is cheaper than rebuilding everything.
      fail-fast: false
      matrix:
        include:
          # mcpb_platform is set only where Claude Desktop exists: there is nothing to install a bundle into on Linux.
          - os: ubuntu-latest
            arch: x86_64
            suffix: linux-x86_64
            exe: ''
          - os: ubuntu-24.04-arm
            arch: aarch64
            suffix: linux-aarch64
            exe: ''
          - os: macos-latest
            arch: aarch64
            suffix: macos-aarch64
            exe: ''
            mcpb_platform: darwin
          - os: windows-latest
            arch: x86_64
            suffix: windows-x86_64
            exe: '.exe'
            mcpb_platform: win32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag (Unix)
        if: runner.os != 'Windows'
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Set version from tag (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build native image
        run: mvn -B package -Dnative -DskipTests

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

      - name: List signing identities (macOS)
        if: runner.os == 'macOS'
        run: security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain"

      # Sign before the sanity test so the test exercises the hardened-runtime binary. No entitlements: the
      # native image JITs nothing and loads no unsigned dylibs (the mail, HTML and PDF libraries are pure Java).
      - name: Sign native binary (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "target/email-mcp-server-${VERSION}-runner"
          codesign --verify --strict --verbose=2 "target/email-mcp-server-${VERSION}-runner"

      - name: Sanity test native binary (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B test-compile failsafe:integration-test failsafe:verify -Dnative.image.path=target/email-mcp-server-${VERSION}-runner

      - name: Sanity test native binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B test-compile failsafe:integration-test failsafe:verify -Dnative.image.path=target/email-mcp-server-${VERSION}-runner.exe

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv target/email-mcp-server-${VERSION}-runner \
             target/email-mcp-server-${VERSION}-${{ matrix.suffix }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv target/email-mcp-server-${VERSION}-runner.exe \
             target/email-mcp-server-${VERSION}-${{ matrix.suffix }}.exe

      # A bare executable cannot be stapled, so Gatekeeper fetches the ticket online
      # on first launch. Notarizing the zipped binary is enough for that lookup.
      - name: Notarize native binary (macOS)
        if: runner.os == 'macOS'
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="target/email-mcp-server-${VERSION}-${{ matrix.suffix }}"
          ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k "$BINARY" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait

      - name: Clean up keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain"

      # An MCP Bundle for each platform that has Claude Desktop (macOS, Windows), around the notarized (macOS)
      # or bare (Windows, signed later by mcpb/Sign-Release.ps1) binary. Packed here so the executable bit
      # survives on macOS.
      - name: Package MCP bundle
        if: matrix.mcpb_platform != ''
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash mcpb/pack.sh "$VERSION" "${{ matrix.suffix }}" "${{ matrix.mcpb_platform }}" \
            "target/email-mcp-server-${VERSION}-${{ matrix.suffix }}${{ matrix.exe }}" \
            "target/email-mcp-server-${VERSION}-${{ matrix.suffix }}.mcpb"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.suffix }}
          path: |
            target/email-mcp-server-*-${{ matrix.suffix }}
            target/email-mcp-server-*-${{ matrix.suffix }}.exe
            target/email-mcp-server-*-${{ matrix.suffix }}.mcpb

  # ── Create GitHub release with all artifacts ─────────────────────────
  release:
    needs: [ uber-jar, native ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # The universal bundle carries the macOS and Windows binaries (no Linux: Claude Desktop does not run
      # there); its manifest picks one per platform at launch.
      # It is for when one file has to serve both platforms. Packed here, on Linux, so the executable bit of
      # the macOS binary survives (download-artifact drops it, pack-universal.sh restores it).
      - name: Package universal MCP bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash mcpb/pack-universal.sh "$VERSION" artifacts "artifacts/email-mcp-server-${VERSION}-universal.mcpb"

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
